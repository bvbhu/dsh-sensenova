# dsh-sensenova bundle patch：把插件行插进 profile 组合树。
# 作为 profile 的一层补丁应用在 dsh-base / dsh-web-app 之后。
# 行 id（sensenova）同时是 Config 页面里的设置分组键。
#
# 开发期：name 用入口文件的 file:// URL，改 lib/*.js 后在文件名后加
# ?v=2、?v=3… 再禁用/启用本 bundle，新代码即生效（Node ESM 以完整
# URL 为缓存键）。发布后改为包名（照 dsh-quilt-compact 安装方式）。
- insert:
    - id: dsh-sensenova
      name: 'file:///D:/projects/dsh-sensenova/lib/index.js?v=5'
